[package]
name = "pocket-corner"
version = "1.0.0"
description = "Pocket Corner - Desktop Toy Social Multiplayer"
authors = ["Pocket Corner Team"]
edition = "2021"

[lib]
name = "pocket_corner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.1.0", features = ["macos-private-api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
